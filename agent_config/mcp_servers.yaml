# MCP 服务器配置 — 对标 Cline mcpSettings.json
#
# Phase 22: 让 AI agent 通过 use_mcp_tool / access_mcp_resource 工具
# 接入 MCP (Model Context Protocol) 服务器生态。
#
# 配置格式:
#   servers:
#     - name: 服务器唯一标识（agent 调用时使用）
#       transport: stdio | http
#       enabled: true | false  （可选，默认 true）
#       description: 服务器用途说明（会注入 system prompt）
#
#       # stdio 传输：spawn 子进程，通过 stdin/stdout JSON-RPC 通信
#       command: 启动命令（如 npx / python / node）
#       args: [命令参数列表]
#       env:  （可选）环境变量，会与系统 env 合并
#         KEY: value
#
#       # http 传输：通过 HTTP POST JSON-RPC 通信
#       url: http://host:port/path
#       headers:  （可选）
#         Authorization: Bearer xxx
#
#       # P1-19: 自动批准的工具名列表（对标 Cline autoApprove）
#       # 列表中的工具调用时跳过用户审批，直接执行。
#       # 未在列表中的工具按默认审批逻辑处理。
#       auto_approve:  （可选）
#         - "read_file"
#         - "list_directory"
#
# 安全约束:
#   - API keys 必须从系统环境变量读取，使用 ${ENV_VAR} 语法
#   - 例: api_key: ${MCP_API_KEY}  会读取 os.environ["MCP_API_KEY"]
#   - 不要在此文件直接硬编码密钥
#
# 启用流程:
#   1. 在 servers 列表中添加服务器配置
#   2. 重启后端服务（app.py）
#   3. agent 调用 use_mcp_tool(server_name, tool_name, args) 使用
#
# 对标 Cline:
#   - sdk/packages/core/src/extensions/tools/mcp/use-mcp-tool.ts
#   - sdk/packages/core/src/extensions/tools/mcp/access-mcp-resource.ts

servers:
  # Tavily 搜索服务 — 替代已删除的 web_tool.py WebSearchTool
  # 提供高质量网络搜索能力，agent 通过 use_mcp_tool 调用
  # 需要：
  #   1. 在系统环境变量中设置 TAVILY_API_KEY
  #   2. 免费额度 1000 次/月，注册地址：https://tavily.com
  #   3. 工具：tavily_search（搜索）、tavily_extract（网页内容提取）、tavily_crawl / tavily_map / tavily_research
  - name: tavily-search
    transport: stdio
    enabled: true
    description: 网络搜索服务，提供高质量搜索结果。用于搜索新闻、财报、行业信息等。可通过 use_mcp_tool 调用，工具名为 tavily_search。
    command: npx
    args:
      - "-y"
      - "tavily-mcp@latest"
    env:
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
    auto_approve:
      - "tavily_search"
