  #   description: 远程搜索服务
  #   url: http://localhost:8080/mcp
  #   headers:
  #     Authorization: "Bearer ${MCP_SEARCH_TOKEN}"

# Phase 3.8 (Q8): MCP 工具粒度策略 — 对标 Cline policies.ts ToolPolicy
#   - server: 服务器名（必填）
#     tool: 工具名（必填）
#     enabled: true | false  （可选，默认 true；false 表示完全禁用该工具）
#     auto_approve: true | false  （可选，默认 true；false 表示调用前需用户批准）
#
# 示例:
#   tool_policies:
#     - server: trading
#       tool: place_order
#       auto_approve: false  # 调用前需用户确认
#     - server: filesystem
#       tool: delete_file
#       enabled: false        # 完全禁用
tool_policies: []
