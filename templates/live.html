{# -*- coding: utf-8 -*- #}
{% extends "base.html" %}
{% block title %}实盘监控 -- AI 量化系统{% endblock %}

{% block plotly %}
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
{% endblock %}

{% block content %}
<div x-data="liveApp()" x-init="init()">
    <!-- ===== 共享: 帮助 modal + 弹窗 (sub-template) ===== -->
    {% include "live/shared.html" %}
    <!-- ===== 模拟盘视图 (sub-template) ===== -->
    {% include "live/sim.html" %}
    <!-- ===== 实盘视图 (sub-template) ===== -->
    {% include "live/real.html" %}
</div>

<!-- 注入视图模式 (由路由决定 sim/real), app.js 以 window.__liveViewMode 读取 -->
<script>window.__liveViewMode = '{{ view_mode|default("sim") }}';</script>
<!-- liveApp 逻辑外置: 与模板解耦, 结构统一 (含 sim/real 双引擎全部交互) -->
<script src="/static/js/live/app.js?v={{ app_ver }}"></script>
{% endblock %}
