<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI 量化交易系统{% endblock %}</title>

    <!-- Tailwind CSS (CDN, 无构建) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 必须先于 Alpine: defer 脚本按顺序执行, main.js 定义 window.App, 页面里 x-init 会调 App.get -->
    <link rel="stylesheet" href="/static/css/main.css?v=20260731g">
    <!-- AI 对话消息渲染样式 (复用 .msg-row / .chat-input-row 等) -->
    <link rel="stylesheet" href="/static/css/ai-chat.css?v=20260731">
    <script defer src="/static/js/marked.min.js?v=20260731"></script>
    <script defer src="/static/js/main.js?v=20260731"></script>
    <!-- AI 助手侧栏逻辑 (复用 AI_CHAT 对象) -->
    <script defer src="/static/js/ai-chat.js?v=20260817"></script>
    <!-- Alpine.js (轻量交互, 14kb) -->
    <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <!-- Plotly.js (图表) -->
    {% block plotly %}{% endblock %}
    <!-- ECharts 5 (个股行情 K 线) -->
    {% block echarts %}{% endblock %}
    <style>[x-cloak] { display: none !important; }</style>
    {% block head_extra %}{% endblock %}
</head>
<body data-chat-mode="sidebar">
<!-- 三栏布局: 左侧导航 + 中间主内容 + 右侧 AI 助手侧栏 -->
<div class="app-layout">

    <!-- ==================== 左侧导航栏 (图标+文字, 可折叠) ==================== -->
    <aside class="app-rail" id="app-rail">
        <div class="rail-brand">
            <span class="rail-brand-mark">AI</span>
            <span class="rail-brand-text">量化系统</span>
        </div>
        <nav class="rail-nav">
            <a href="/live/sim" class="rail-item {% if active=='live' %}active{% endif %}" title="实盘监控">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                <span class="rail-text">实盘监控</span>
            </a>
            <a href="/backtest" class="rail-item {% if active=='backtest' %}active{% endif %}" title="回测">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span class="rail-text">回测</span>
            </a>
            <a href="/review" class="rail-item {% if active=='review' %}active{% endif %}" title="复盘 & 策略管理">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span class="rail-text">复盘 & 策略</span>
            </a>
            <a href="/ai-chat" class="rail-item {% if active=='ai-chat' %}active{% endif %}" title="AI 助手 (全屏)">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 1 3 3v1h1a3 3 0 0 1 3 3v1h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v1a3 3 0 0 1-3 3h-1v1a3 3 0 0 1-3 3 3 3 0 0 1-3-3v-1H8a3 3 0 0 1-3-3v-1H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h1V9a3 3 0 0 1 3-3h1V5a3 3 0 0 1 3-3z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/></svg>
                <span class="rail-text">AI 助手</span>
            </a>
            <a href="/morning" class="rail-item {% if active=='morning' %}active{% endif %}" title="晨会分析">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="2" x2="12" y2="9"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="8 6 12 2 16 6"/></svg>
                <span class="rail-text">晨会分析</span>
            </a>
            <a href="/sector-rotation" class="rail-item {% if active=='sector-rotation' %}active{% endif %}" title="板块轮动">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span class="rail-text">板块轮动</span>
            </a>
            <a href="/concept-rotation" class="rail-item {% if active=='concept-rotation' %}active{% endif %}" title="概念轮动">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                <span class="rail-text">概念轮动</span>
            </a>
            <a href="/dragon-review" class="rail-item {% if active=='dragon-review' %}active{% endif %}" title="龙头复盘">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                <span class="rail-text">龙头复盘</span>
            </a>
            <a href="/stock-quote" class="rail-item {% if active=='stock-quote' %}active{% endif %}" title="个股行情">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="6" y2="12"/><line x1="6" y1="6" x2="6" y2="18"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="18" y1="8" x2="18" y2="16"/><line x1="18" y1="12" x2="21" y2="12"/></svg>
                <span class="rail-text">个股行情</span>
            </a>
            <a href="/data-collection" class="rail-item {% if active=='data-collection' %}active{% endif %}" title="数据采集">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                <span class="rail-text">数据采集</span>
            </a>
            <a href="/trade-plan" class="rail-item {% if active=='trade-plan' %}active{% endif %}" title="交易计划">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span class="rail-text">交易计划</span>
            </a>
            <a href="/factor" class="rail-item {% if active=='factor' %}active{% endif %}" title="因子库">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                <span class="rail-text">因子库</span>
            </a>
            <a href="/system" class="rail-item {% if active=='system' %}active{% endif %}" title="系统状态">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span class="rail-text">系统状态</span>
            </a>
        </nav>
        <div class="rail-footer">
            <button class="rail-collapse-btn" id="rail-collapse-btn" title="折叠/展开侧栏">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                <span class="rail-text">收起</span>
            </button>
        </div>
    </aside>

    <!-- ==================== 中间主内容 ==================== -->
    <main class="app-content" id="app-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ==================== 右侧 AI 助手侧栏 (可拖拽宽度 + 可收起) ==================== -->
    <aside class="ai-sidebar" id="ai-sidebar">
        <!-- 拖拽分隔条 -->
        <div class="ai-sidebar-resizer" id="ai-sidebar-resizer" title="拖拽调节宽度"></div>
        <!-- 侧栏内容 (精简版对话) -->
        {% include "_ai_sidebar.html" %}
    </aside>

    <!-- 侧栏收起后的展开按钮 -->
    <button class="ai-sidebar-expand-btn" id="ai-sidebar-expand-btn" title="展开 AI 助手">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 2a3 3 0 0 1 3 3v1h1a3 3 0 0 1 3 3v1h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v1a3 3 0 0 1-3 3h-1v1a3 3 0 0 1-3 3 3 3 0 0 1-3-3v-1H8a3 3 0 0 1-3-3v-1H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h1V9a3 3 0 0 1 3-3h1V5a3 3 0 0 1 3-3z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/></svg>
        <span class="expand-btn-text">AI</span>
    </button>

</div>
</body>
</html>
