<!-- Agent 设置抽屉 — P1-2 新增 -->
<aside class="settings-drawer" id="settings-drawer">
    <div class="settings-header">
        <span class="settings-title">Agent 设置</span>
        <button class="settings-close" onclick="AI_SETTINGS.close()">&times;</button>
    </div>
    <div class="settings-tabs">
        <button class="settings-tab active" data-tab="provider" onclick="AI_SETTINGS.switchTab('provider')">Provider</button>
        <button class="settings-tab" data-tab="mode" onclick="AI_SETTINGS.switchTab('mode')">工作模式</button>
        <button class="settings-tab" data-tab="approval" onclick="AI_SETTINGS.switchTab('approval')">审批记忆</button>
        <button class="settings-tab" data-tab="rules" onclick="AI_SETTINGS.switchTab('rules')">规则开关</button>
        <button class="settings-tab" data-tab="mcp" onclick="AI_SETTINGS.switchTab('mcp')">MCP 服务器</button>
        <button class="settings-tab" data-tab="checkpoint" onclick="AI_SETTINGS.switchTab('checkpoint')">检查点</button>
        <button class="settings-tab" data-tab="file_checkpoint" onclick="AI_SETTINGS.switchTab('file_checkpoint')">文件检查点</button>
        <button class="settings-tab" data-tab="cron" onclick="AI_SETTINGS.switchTab('cron')">定时任务</button>
        <button class="settings-tab" data-tab="pending" onclick="AI_SETTINGS.switchTab('pending')">待处理</button>
    </div>
    <div class="settings-body" id="settings-body">
        <div class="settings-loading">加载中...</div>
    </div>
</aside>
<div class="settings-overlay" id="settings-overlay" onclick="AI_SETTINGS.close()"></div>

<main class="app-main">
<div class="chat-container">
    <!-- 左侧边栏 -->
    <aside class="chat-sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="new-chat-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                新建对话
            </button>
        </div>
        <div class="conversation-list" id="conversation-list"></div>
    </aside>

    <!-- 右侧聊天区 -->
    <section class="chat-main">
        <!-- 聊天工具栏 — Provider 快速切换 + 功能面板入口 -->
        <div class="chat-toolbar" id="chat-toolbar">
            <div class="toolbar-left">
                <label class="toolbar-field">
                    <span class="toolbar-label">Provider</span>
                    <select id="provider-select" class="toolbar-select" title="切换当前会话的大模型 Provider">
                        <option value="">默认 Provider</option>
                    </select>
                </label>
                <button id="provider-edit-btn" class="toolbar-action-btn" title="在设置面板中编辑 Provider 配置">编辑</button>
            </div>
            <div class="toolbar-right">
                <!-- 看板功能已屏蔽：TodoWrite 工具已移除，todos 无数据源，看板失去意义。若需恢复，取消此注释并恢复 ai-chat.js/server.py 中相关代码 -->
                <!-- <button id="toolbar-kanban-btn" class="toolbar-action-btn" title="多会话看板概览">看板概览</button> -->
                <button id="toolbar-checkpoint-btn" class="toolbar-action-btn" title="查看检查点并回滚">检查点</button>
                <button id="toolbar-cron-btn" class="toolbar-action-btn" title="定时任务管理">定时任务</button>
                <button id="toolbar-pending-btn" class="toolbar-action-btn" title="待处理提示词队列">待处理</button>
                <button id="toolbar-settings-btn" class="toolbar-action-btn" title="Agent 设置" onclick="AI_SETTINGS.open()">设置</button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-area">
            <div class="chat-input-row">
                <button class="mode-toggle-btn" id="mode-toggle-btn" title="切换 Plan/Act 模式">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <rect x="3" y="4" width="18" height="16" rx="2"/>
                        <line x1="8" y1="9" x2="16" y2="9"/>
                        <line x1="8" y1="13" x2="14" y2="13"/>
                        <line x1="8" y1="17" x2="12" y2="17"/>
                    </svg>
                    <span class="mode-label" id="mode-label">Act</span>
                </button>
                <textarea id="chat-input" placeholder="输入你的问题，按 Enter 发送，Shift+Enter 换行..." rows="1"></textarea>
                <button class="send-btn" id="send-btn" title="发送">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13"/>
                        <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            <div class="queue-indicator" id="queue-indicator" style="display:none;">
                <span class="queue-badge-num" id="queue-badge-num">0</span>
                <span class="queue-hint" id="queue-hint">条消息排队中，等待当前任务完成后自动处理</span>
            </div>
            <div class="chat-input-hint" id="chat-input-hint">Charles 采用国泰君安五步法进行分析，工具调用过程会实时展示并可折叠查看</div>
        </div>
    </section>
</div>
</main>
</div><!-- /app-layout -->

</body>
</html>
